<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gist — Text Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-bg: #121412;
    --panel: #191c19;
    --panel-line: #2b2e2a;
    --text: #ece9e2;
    --text-dim: #8a8f87;
    --gold: #c9a227;
    --gold-dim: #8f7420;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink-bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
  }

  header{
    padding:28px 40px 20px;
    border-bottom:1px solid var(--panel-line);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .brand-logo{
    width:32px;
    height:32px;
  }
  /* Swap the <img> below for your own logo file, or restyle this SVG mark */
  header h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:28px;
    margin:0;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:14px;
    max-width:36ch;
    text-align:right;
  }

  .key-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 40px;
    border-bottom:1px solid var(--panel-line);
    flex-wrap:wrap;
  }
  .key-row label{
    font-size:13px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .key-row input{
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:2px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:6px 10px;
    width:240px;
  }
  .key-row input:focus{outline:2px solid var(--gold-dim); outline-offset:1px;}
  .key-note{
    font-size:12px;
    color:var(--text-dim);
  }

  main{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    max-width:1180px;
    width:100%;
    margin:0 auto;
    padding:36px 40px 60px;
    gap:0;
  }
  .pane{padding:0 32px;}
  .pane + .pane{border-left:1px solid var(--panel-line);}
  .pane:first-child{padding-left:0;}
  .pane:last-child{padding-right:0;}

  .pane-label{
    font-family:'Source Serif 4',serif;
    font-size:19px;
    margin:0 0 16px;
  }

  textarea{
    width:100%;
    height:280px;
    resize:vertical;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:2px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.6;
    padding:16px;
  }
  textarea::placeholder{color:var(--text-dim);}
  textarea:focus{outline:2px solid var(--gold-dim); outline-offset:1px;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    font-size:13px;
    color:var(--text-dim);
  }

  .length-group{display:flex; gap:6px;}
  .length-group button{
    background:transparent;
    border:1px solid var(--panel-line);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:5px 12px;
    border-radius:2px;
    cursor:pointer;
  }
  .length-group button[aria-pressed="true"]{
    border-color:var(--gold-dim);
    color:var(--gold);
  }

  .summarize-btn{
    margin-top:20px;
    width:100%;
    background:var(--gold);
    color:#161711;
    border:none;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px;
    border-radius:2px;
    cursor:pointer;
  }
  .summarize-btn:hover{background:#dab33a;}
  .summarize-btn:disabled{background:var(--gold-dim); color:#3a3122; cursor:default;}

  .output-box{
    min-height:280px;
    border:1px solid var(--panel-line);
    border-radius:2px;
    padding:16px;
    font-size:15px;
    line-height:1.65;
    color:var(--text-dim);
  }
  .output-box.has-result{color:var(--text);}

  .btn-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .copy-btn, .clear-btn{
    background:transparent;
    border:1px solid var(--panel-line);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:6px 14px;
    border-radius:2px;
    cursor:pointer;
  }
  .clear-btn:hover{border-color:#a2453f; color:#d97b74;}
  .copy-btn:hover{border-color:var(--gold-dim); color:var(--gold);}

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    padding:16px;
    border-top:1px solid var(--panel-line);
  }

  @media (max-width:720px){
    main{grid-template-columns:1fr;}
    .pane + .pane{border-left:none; border-top:1px solid var(--panel-line); margin-top:32px; padding-top:32px;}
    .pane{padding:0 !important;}
    header{padding:24px;}
    header p{text-align:left;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <!-- Replace this SVG with <img src="your-logo.png" class="brand-logo" alt="Gist logo"> once you have real artwork -->
    <svg class="brand-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="16" cy="16" r="15" stroke="#c9a227" stroke-width="1.5"/>
      <path d="M9 16.5c2-5 5-7.5 7-7.5s2 2.5 0 7.5-5 7.5-7 7.5-2-2.5 0-7.5Z" stroke="#c9a227" stroke-width="1.5"/>
    </svg>
    <h1>Gist</h1>
  </div>
  <p>Paste in a long piece of writing, get back the shape of it.</p>
</header> 
<main>
  <section class="pane">
    <h2 class="pane-label">Your text</h2>
    <textarea id="input-text" placeholder="Paste an article, report, or set of notes here…"></textarea>
    <div class="meta-row">
      <span id="word-count">0 words</span>
      <div class="length-group" id="length-group">
        <button type="button" data-length="short">Short</button>
        <button type="button" data-length="medium" aria-pressed="true">Medium</button>
        <button type="button" data-length="long">Long</button>
      </div>
    </div>
    <button class="summarize-btn" id="summarize-btn">Summarize</button>
  </section>

  <section class="pane">
    <h2 class="pane-label">Summary</h2>
    <div class="output-box" id="output-box">Your summary will appear here.</div>
    <div class="btn-row">
      <button class="copy-btn" id="copy-btn">Copy</button>
      <button class="clear-btn" id="clear-btn">Clear</button>
    </div>
  </section>
</main>

<footer>Gist — summarize() is left for you to implement</footer>

 <script src="script.js"></script>

</body>
</html>
